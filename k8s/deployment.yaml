apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-devops-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-devops
  template:
    metadata:
      labels:
        app: nginx-devops
    spec:
      containers:
        - name: nginx-devops
          image: rotezsolutions/nginx-devops-assignment:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
